<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team - TaskFlow</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <button class="hamburger" id="hamburger">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-layout">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Team Members</h1>
                    <p class="page-subtitle">All registered users in the system</p>
                </div>
            </div>

            <div class="card">
                <div id="teamList">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/sidebar.js"></script>
    <script>
        const user = requireAuth();
        // only admins can see this page
        if (user.role !== 'admin') window.location.href = '/pages/dashboard.html';
        renderSidebar('team');

        async function loadTeam() {
            try {
                const users = await api.getAllUsers();
                if (users.length === 0) {
                    document.getElementById('teamList').innerHTML =
                        '<div class="empty-state"><div class="empty-state-icon">👥</div><p>No users found.</p></div>';
                    return;
                }

                document.getElementById('teamList').innerHTML = `
                    <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Joined</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${users.map((u, i) => `
                                <tr>
                                    <td class="text-muted">${i + 1}</td>
                                    <td class="fw-600">${u.name}${u.id === user.id ? ' <span class="text-muted">(you)</span>' : ''}</td>
                                    <td>${u.email}</td>
                                    <td><span class="badge badge-${u.role}">${u.role}</span></td>
                                    <td>${formatDate(u.created_at)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    </div>
                `;
            } catch (err) {
                showToast('Failed to load team: ' + err.message, 'error');
            }
        }

        loadTeam();
    </script>
</body>
</html>
