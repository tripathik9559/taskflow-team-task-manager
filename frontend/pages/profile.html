<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - TaskFlow</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <button class="hamburger" id="hamburger">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-layout">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">My Profile</h1>
                    <p class="page-subtitle">Update your account details</p>
                </div>
            </div>

            <div class="card" style="max-width:500px">
                <div class="card-header">
                    <span class="card-title">👤 Account Information</span>
                </div>
                <div class="card-body" id="profileBody">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/sidebar.js"></script>
    <script>
        const user = requireAuth();
        renderSidebar('profile');

        async function loadProfile() {
            try {
                const me = await api.getMe();
                document.getElementById('profileBody').innerHTML = `
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="profileName" value="${me.name}">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="profileEmail" value="${me.email}">
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <input type="text" value="${me.role}" disabled style="background:#f9fafb;color:#6b7280">
                    </div>
                    <div class="form-group">
                        <label>Member Since</label>
                        <input type="text" value="${formatDate(me.created_at)}" disabled style="background:#f9fafb;color:#6b7280">
                    </div>
                    <div style="display:flex;gap:10px;margin-top:8px">
                        <button class="btn btn-success" onclick="saveProfile()" style="width:auto">Save Changes</button>
                        <button class="btn btn-danger" onclick="logout()" style="width:auto">Logout</button>
                    </div>
                `;
            } catch (err) {
                showToast('Failed to load profile: ' + err.message, 'error');
            }
        }

        async function saveProfile() {
            const name  = document.getElementById('profileName').value.trim();
            const email = document.getElementById('profileEmail').value.trim();

            if (!name || !email) return showToast('Name and email are required', 'error');

            try {
                await api.updateProfile({ name, email });
                // update local storage too
                const stored = getCurrentUser();
                stored.name = name;
                stored.email = email;
                localStorage.setItem('user', JSON.stringify(stored));
                showToast('Profile updated successfully!');
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        loadProfile();
    </script>
</body>
</html>
