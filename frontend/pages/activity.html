<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Log - TaskFlow</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <button class="hamburger" id="hamburger">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-layout">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Activity Log</h1>
                    <p class="page-subtitle">Who did what and when</p>
                </div>
            </div>

            <div class="card">
                <div class="card-body" id="activityList">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/sidebar.js"></script>
    <script>
        const user = requireAuth();
        if (user.role !== 'admin') window.location.href = '/pages/dashboard.html';
        renderSidebar('activity');

        async function loadActivity() {
            try {
                const logs = await api.getActivityLog();
                if (logs.length === 0) {
                    document.getElementById('activityList').innerHTML =
                        '<div class="empty-state"><div class="empty-state-icon">📋</div><p>No activity recorded yet.</p></div>';
                    return;
                }

                document.getElementById('activityList').innerHTML = logs.map(log => `
                    <div class="activity-item">
                        <div class="activity-dot"></div>
                        <div style="flex:1">
                            <div>
                                <strong>${log.user_name}</strong>
                                <span class="text-muted"> — ${log.action}</span>
                            </div>
                            <div class="activity-time">${formatDateTime(log.created_at)}</div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                showToast('Failed to load activity: ' + err.message, 'error');
            }
        }

        loadActivity();
    </script>
</body>
</html>
