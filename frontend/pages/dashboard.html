<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TaskFlow</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <button class="hamburger" id="hamburger">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-layout">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Dashboard</h1>
                    <p class="page-subtitle" id="dashSubtitle">Overview of tasks and projects</p>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-grid" id="statsGrid">
                <div class="loading"><div class="spinner"></div></div>
            </div>

            <div class="grid-2 mt-24">
                <!-- Project Progress -->
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">📁 Project Progress</span>
                    </div>
                    <div class="card-body" id="projectProgress">
                        <div class="loading"><div class="spinner"></div></div>
                    </div>
                </div>

                <!-- Recent Activity -->
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">🕐 Recent Activity</span>
                    </div>
                    <div class="card-body" id="recentActivity">
                        <div class="loading"><div class="spinner"></div></div>
                    </div>
                </div>
            </div>

            <!-- Overdue Tasks -->
            <div class="card mt-24">
                <div class="card-header">
                    <span class="card-title">🔴 Overdue Tasks</span>
                </div>
                <div id="overdueSection">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/sidebar.js"></script>
    <script>
        const user = requireAuth();
        renderSidebar('dashboard');
        document.getElementById('dashSubtitle').textContent =
            `Welcome back, ${user.name}! Here's what's happening.`;

        async function loadDashboard() {
            try {
                const data = await api.getDashboard();
                const s = data.stats;

                // render stat cards
                document.getElementById('statsGrid').innerHTML = `
                    <div class="stat-card primary">
                        <div class="stat-number">${s.total || 0}</div>
                        <div class="stat-label">Total Tasks</div>
                    </div>
                    <div class="stat-card warning">
                        <div class="stat-number">${s.todo || 0}</div>
                        <div class="stat-label">To Do</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${s.in_progress || 0}</div>
                        <div class="stat-label">In Progress</div>
                    </div>
                    <div class="stat-card success">
                        <div class="stat-number">${s.done || 0}</div>
                        <div class="stat-label">Done</div>
                    </div>
                    <div class="stat-card danger">
                        <div class="stat-number">${s.overdue || 0}</div>
                        <div class="stat-label">Overdue</div>
                    </div>
                    ${data.totalUsers !== null ? `
                    <div class="stat-card">
                        <div class="stat-number">${data.totalUsers}</div>
                        <div class="stat-label">Team Members</div>
                    </div>` : ''}
                `;

                // project progress bars
                if (data.projectStats.length === 0) {
                    document.getElementById('projectProgress').innerHTML =
                        '<div class="empty-state"><div class="empty-state-icon">📁</div><p>No projects yet</p></div>';
                } else {
                    document.getElementById('projectProgress').innerHTML = data.projectStats.map(p => {
                        const pct = p.total_tasks > 0 ? Math.round((p.done_tasks / p.total_tasks) * 100) : 0;
                        return `
                            <div class="mb-16">
                                <div class="flex-between mb-4">
                                    <span class="fw-600" style="font-size:13px">${p.name}</span>
                                    <span class="text-muted">${p.done_tasks}/${p.total_tasks} tasks · ${pct}%</span>
                                </div>
                                <div class="progress-bar-wrap">
                                    <div class="progress-bar-fill" style="width:${pct}%"></div>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                // recent activity
                if (data.recentActivity.length === 0) {
                    document.getElementById('recentActivity').innerHTML =
                        '<div class="empty-state"><p>No activity yet</p></div>';
                } else {
                    document.getElementById('recentActivity').innerHTML = data.recentActivity.map(a => `
                        <div class="activity-item">
                            <div class="activity-dot"></div>
                            <div>
                                <div><strong>${a.user_name}</strong> — ${a.action}</div>
                                <div class="activity-time">${formatDateTime(a.created_at)}</div>
                            </div>
                        </div>
                    `).join('');
                }

                // overdue tasks
                if (data.overdueTasks.length === 0) {
                    document.getElementById('overdueSection').innerHTML =
                        '<div class="empty-state"><div class="empty-state-icon">✅</div><p>No overdue tasks. Great job!</p></div>';
                } else {
                    document.getElementById('overdueSection').innerHTML = `
                        <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Task</th>
                                    <th>Project</th>
                                    <th>Assigned To</th>
                                    <th>Deadline</th>
                                    <th>Priority</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.overdueTasks.map(t => `
                                    <tr class="overdue-row">
                                        <td class="fw-600">${t.title}</td>
                                        <td>${t.project_name || '—'}</td>
                                        <td>${t.assigned_to_name || 'Unassigned'}</td>
                                        <td class="overdue-text">${formatDate(t.deadline)}</td>
                                        <td>${priorityBadge(t.priority)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                        </div>
                    `;
                }
            } catch (err) {
                showToast('Failed to load dashboard: ' + err.message, 'error');
            }
        }

        loadDashboard();
    </script>
</body>
</html>
