<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TaskFlow</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <button class="hamburger" id="hamburger">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-layout">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Dashboard</h1>
                    <p class="page-subtitle" id="dashSubtitle">Overview of tasks and projects</p>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="stats-grid" id="statsGrid">
                <div class="loading"><div class="spinner"></div></div>
            </div>

            <div class="grid-2 mt-24">
                <!-- Project Progress -->
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">📁 Project Progress</span>
                    </div>
                    <div class="card-body" id="projectProgress">
                        <div class="loading"><div class="spinner"></div></div>
                    </div>
                </div>

                <!-- Recent Activity -->
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">🕐 Recent Activity</span>
                    </div>
                    <div class="card-body" id="recentActivity">
                        <div class="loading"><div class="spinner"></div></div>
                    </div>
                </div>
            </div>

            <!-- Overdue Tasks -->
            <div class="card mt-24">
                <div class="card-header">
                    <span class="card-title">🔴 Overdue Tasks</span>
                </div>
                <div id="overdueSection">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/sidebar.js"></script>
    <script>
        const user = requireAuth();
        renderSidebar('dashboard');
        document.getElementById('dashSubtitle').textContent =
            `Welcome back, ${user.name}! Here's what's happening.`;

        async function loadDashboard() {
            try {
                const data = await api.getDashboard();
                const s = data.stats;
                const activeProjects = data.projectStats.length;
                const completedProjects = data.projectStats.filter(p =>
                    p.total_tasks > 0 && p.done_tasks === p.total_tasks
                ).length;

                // render stat cards — exactly: Total, Completed, Pending, Active Projects + extras
                const statCards = [
                    {
                        label: 'Total Tasks',
                        value: s.total || 0,
                        icon: '📋',
                        cls: 'primary',
                        sub: `across ${activeProjects} project${activeProjects !== 1 ? 's' : ''}`
                    },
                    {
                        label: 'Completed',
                        value: s.done || 0,
                        icon: '✅',
                        cls: 'success',
                        sub: s.total > 0 ? `${Math.round((s.done / s.total) * 100)}% completion rate` : '0% completion rate'
                    },
                    {
                        label: 'Pending',
                        value: (s.todo || 0) + (s.in_progress || 0),
                        icon: '⏳',
                        cls: 'warning',
                        sub: `${s.in_progress || 0} in progress · ${s.todo || 0} to do`
                    },
                    {
                        label: 'Active Projects',
                        value: activeProjects,
                        icon: '📁',
                        cls: 'info',
                        sub: completedProjects > 0 ? `${completedProjects} fully completed` : 'in progress'
                    },
                    {
                        label: 'Overdue',
                        value: s.overdue || 0,
                        icon: '🔴',
                        cls: s.overdue > 0 ? 'danger' : 'success',
                        sub: s.overdue > 0 ? 'need immediate attention' : 'all on track'
                    },
                    ...(data.totalUsers !== null ? [{
                        label: 'Team Members',
                        value: data.totalUsers,
                        icon: '👥',
                        cls: '',
                        sub: 'registered users'
                    }] : [])
                ];

                document.getElementById('statsGrid').innerHTML = statCards.map(c => `
                    <div class="stat-card ${c.cls}">
                        <div class="stat-icon">${c.icon}</div>
                        <div class="stat-number">${c.value}</div>
                        <div class="stat-label">${c.label}</div>
                        <div class="stat-sub">${c.sub}</div>
                    </div>
                `).join('');

                // project progress bars
                if (data.projectStats.length === 0) {
                    document.getElementById('projectProgress').innerHTML =
                        '<div class="empty-state"><div class="empty-state-icon">📁</div><p>No projects yet</p><p class="text-muted" style="font-size:12px;margin-top:4px">Create a project to get started</p></div>';
                } else {
                    document.getElementById('projectProgress').innerHTML = data.projectStats.map(p => {
                        const pct = p.total_tasks > 0 ? Math.round((p.done_tasks / p.total_tasks) * 100) : 0;
                        const barColor = pct === 100 ? 'var(--success)' : pct >= 50 ? 'var(--primary)' : 'var(--warning)';
                        return `
                            <div class="project-progress-item">
                                <div class="flex-between mb-4">
                                    <span class="fw-600" style="font-size:13px">${p.name}</span>
                                    <span class="text-muted">${p.done_tasks}/${p.total_tasks} · <strong style="color:${barColor}">${pct}%</strong></span>
                                </div>
                                <div class="progress-bar-wrap">
                                    <div class="progress-bar-fill" style="width:${pct}%;background:${barColor}"></div>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                // recent activity
                if (data.recentActivity.length === 0) {
                    document.getElementById('recentActivity').innerHTML =
                        '<div class="empty-state"><div class="empty-state-icon">🕐</div><p>No activity yet</p></div>';
                } else {
                    document.getElementById('recentActivity').innerHTML = data.recentActivity.map(a => `
                        <div class="activity-item">
                            <div class="activity-dot"></div>
                            <div>
                                <div><strong>${a.user_name}</strong> — ${a.action}</div>
                                <div class="activity-time">${formatDateTime(a.created_at)}</div>
                            </div>
                        </div>
                    `).join('');
                }

                // overdue tasks
                if (data.overdueTasks.length === 0) {
                    document.getElementById('overdueSection').innerHTML =
                        '<div class="empty-state"><div class="empty-state-icon">✅</div><p>No overdue tasks</p><p class="text-muted" style="font-size:12px;margin-top:4px">Great job staying on track!</p></div>';
                } else {
                    document.getElementById('overdueSection').innerHTML = `
                        <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Task</th>
                                    <th>Project</th>
                                    <th>Assigned To</th>
                                    <th>Deadline</th>
                                    <th>Priority</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.overdueTasks.map(t => `
                                    <tr class="overdue-row">
                                        <td class="fw-600">${t.title}</td>
                                        <td>${t.project_name || '—'}</td>
                                        <td>${t.assigned_to_name || '<span class="text-muted">Unassigned</span>'}</td>
                                        <td class="overdue-text">${formatDate(t.deadline)}</td>
                                        <td>${priorityBadge(t.priority)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                        </div>
                    `;
                }
            } catch (err) {
                showToast('Failed to load dashboard: ' + err.message, 'error');
            }
        }

        loadDashboard();
    </script>
</body>
</html>
