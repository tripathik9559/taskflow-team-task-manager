<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-logo">
                <h1>⚡ TaskFlow</h1>
                <p>Team Task Manager</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Login</button>
                <button class="auth-tab" id="tabSignup" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <!-- Login Form -->
            <div id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password">
                </div>
                <button class="btn btn-primary" onclick="handleLogin()">Login</button>
                <p class="text-muted mt-16" style="text-align:center">
                    Demo: admin@test.com / password123
                </p>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" class="hidden">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="signupName" placeholder="Your full name">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" placeholder="Min 6 characters">
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="signupRole">
                        <option value="member">Member</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="handleSignup()">Create Account</button>
            </div>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script>
        // if already logged in, go to dashboard
        redirectIfLoggedIn();

        function switchTab(tab) {
            const isLogin = tab === 'login';
            document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
            document.getElementById('signupForm').classList.toggle('hidden', isLogin);
            document.getElementById('tabLogin').classList.toggle('active', isLogin);
            document.getElementById('tabSignup').classList.toggle('active', !isLogin);
        }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) return showToast('Please fill in all fields', 'error');

            try {
                const data = await api.login({ email, password });
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                showToast('Welcome back, ' + data.user.name + '!');
                setTimeout(() => window.location.href = '/pages/dashboard.html', 800);
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function handleSignup() {
            const name     = document.getElementById('signupName').value.trim();
            const email    = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const role     = document.getElementById('signupRole').value;

            if (!name || !email || !password) return showToast('Please fill all fields', 'error');

            try {
                await api.signup({ name, email, password, role });
                showToast('Account created! Please login.');
                switchTab('login');
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // allow Enter key on password field
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const loginVisible = !document.getElementById('loginForm').classList.contains('hidden');
                if (loginVisible) handleLogin();
                else handleSignup();
            }
        });
    </script>
</body>
</html>
